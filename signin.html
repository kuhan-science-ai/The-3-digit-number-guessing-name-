<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Number Guessing Game</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1412246666235077"
    crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="signin-shell">
    <section class="signin-card">
      <div class="signin-copy">
        <p class="kicker">3 Digit Duel</p>
        <h1>Crack codes, race friends, and climb the board.</h1>
        <p id="authStatus" class="lead auth-lead">Use your Google account to unlock the number guessing game.</p>
        <div class="signin-actions">
          <button id="googleSignInBtn" class="primary-btn" type="button">Continue with Google</button>
        </div>
        <p class="signin-note">After sign-in, you will be sent directly to the game board.</p>
      </div>

      <div class="signin-preview" aria-hidden="true">
        <div class="preview-orbit">
          <span>7</span>
          <span>4</span>
          <span>9</span>
        </div>
        <div class="preview-board">
          <p class="mini-label">Live puzzle preview</p>
          <div class="preview-row strong">
            <span>479</span>
            <strong>Hidden code</strong>
          </div>
          <div class="preview-row">
            <span>498</span>
            <strong>1 right spot, 1 wrong spot</strong>
          </div>
          <div class="preview-row">
            <span>762</span>
            <strong>1 right spot</strong>
          </div>
          <div class="preview-score">
            <span>Daily</span>
            <span>Duel</span>
            <span>Time Attack</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./auth.js?v=20260421-2"></script>
</body>
</html>
